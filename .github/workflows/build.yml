
name: Build GG Fall

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout GG Fall
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev curl xz-utils patch python3 cmake ninja-build git

      - name: Checkout Xbox SDK
        uses: actions/checkout@v4
        with:
          repository: xenosworks/xsdk
          path: xsdk

      - name: Build toolchain
        working-directory: xsdk
        env:
          PREFIX: ${{ github.workspace }}/xsdk-gcc
          WORK: ${{ runner.temp }}/xsdk-gcc-work
          JOBS: "2"
        run: bash tools/toolchain/build.sh

      - name: Build shader compiler
        run: |
          git clone --depth 1 --branch xenon https://github.com/xenosworks/glslang-xenon.git glslang-xenon
          cd glslang-xenon
          python3 update_glslang_sources.py
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_OPT=ON -DSPIRV_SKIP_EXECUTABLES=ON -DGLSLANG_TESTS=OFF
          cmake --build build --parallel 2
          cp build/StandAlone/glslang "${GITHUB_WORKSPACE}/xsdk-gcc/bin/glslang"

      
      - name: Configure GG Fall
        run: |
          pwd
          git rev-parse --short HEAD
          find . -maxdepth 3 -iname 'CMakeLists.txt' -print
          echo "Conteudo da pasta game:"
          ls -la game
          test -f game/CMakeLists.txt


      - name: Configure GG Fall
        env:
          PREFIX: ${{ github.workspace }}/xsdk-gcc
        run: |
          cmake -S game -B game/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/xsdk/cmake/xsdk.cmake" \
            -DXSDK_TOOLCHAIN="$PREFIX" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile GG Fall
        run: cmake --build game/build --parallel 2

      - name: Package XEX
        run: |
          mkdir -p dist
          test -f game/build/GG-Fall.xex
          cp game/build/GG-Fall.xex dist/GG-Fall.xex

      - name: Upload XEX
        uses: actions/upload-artifact@v4
        with:
          name: GG-Fall-xex
          path: dist/GG-Fall.xex
          retention-days: 14
          
